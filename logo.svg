<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <!-- Cercle blanc -->
  <circle cx="36" cy="36" r="34" fill="white" stroke="#DDD5C8" stroke-width="1.5"/>
  <!-- Goutte de peinture rouge en haut -->
  <path d="M36,7 C37.8,13 41,18.5 39.5,23 C38.2,26.5 33.8,26.5 32.5,23 C31,18.5 34.2,13 36,7Z" fill="#C0392B"/>
  <!-- Petite base de la goutte -->
  <ellipse cx="36" cy="23" rx="3.8" ry="2.5" fill="#C0392B"/>
  <!-- Texte JOLY -->
  <text x="36" y="50"
        font-family="Georgia,'Times New Roman',serif"
        font-size="22" font-weight="700"
        text-anchor="middle">
    <tspan fill="#C0392B">J</tspan><tspan fill="#1a1a1a">OLY</tspan>
  </text>
  <!-- Texte PEINTURE -->
  <text x="36" y="61"
        font-family="Arial,Helvetica,sans-serif"
        font-size="5.5" font-weight="700"
        fill="#999" text-anchor="middle"
        letter-spacing="3">PEINTURE</text>
</svg>
